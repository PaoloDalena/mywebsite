name: Auto update publications (Google Scholar)

on:
  schedule:
    - cron: "0 3 * * 1"   # lunedì 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-pubs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            scholar
            rcrossref
            stringr
            dplyr
            stringdist

      - name: Generate BibTeX from Google Scholar
        env:
          SCHOLAR_ID: "K7KKEgQAAAAJ"
        run: |
          Rscript - <<'RSCRIPT'
          library(scholar)
          library(rcrossref)
          library(dplyr)
          library(stringr)

          sid <- Sys.getenv("SCHOLAR_ID")
          if (sid == "") stop("SCHOLAR_ID non impostato")

          message("Leggo pubblicazioni da Google Scholar per ID: ", sid)
          pubs <- tryCatch(get_publications(sid), error=function(e) {
            message("Errore scholar: ", e$message); data.frame()
          })
          if (nrow(pubs) == 0) {
            message("Nessuna pubblicazione trovata."); quit(save="no", status=0)
          }

          norm <- function(x) x |> tolower() |> stringr::str_replace_all("\\s+"," ") |> stringr::str_trim()

          fetch_doi <- function(title, year){
            y <- suppressWarnings(as.integer(year))
            if (is.na(y)) y <- format(Sys.Date(), "%Y")
            res <- tryCatch(
              rcrossref::cr_works(
                query = title,
                filter = list(from_pub_date=paste0(y-1,"-01-01"), until_pub_date=paste0(y+1,"-12-31")),
                limit = 5
              ),
              error=function(e) NULL
            )
            if (is.null(res) || is.null(res$data) || nrow(res$data)==0) return(NA_character_)
            cand <- res$data
            cand$title_norm <- norm(vapply(cand$title, function(v) if(length(v)) v[1] else "", ""))
            q <- norm(title)
            if (!requireNamespace("stringdist", quietly = TRUE)) {
              install.packages("stringdist", repos="https://cloud.r-project.org")
            }
            cand$score <- stringdist::stringdist(cand$title_norm, q, method="jw")
            doi <- cand$DOI[order(cand$score)][1]
            ifelse(is.na(doi) || doi=="", NA_character_, doi)
          }

          pubs <- pubs %>%
            mutate(
              title = as.character(title),
              year  = suppressWarnings(as.integer(year)),
              doi   = ifelse(is.na(doi) | doi=="",
                             vapply(seq_len(n()), function(i) fetch_doi(title[i], year[i]), ""),
                             doi)
            )

          get_bib <- function(doi){
            if (is.na(doi) || doi=="") return(NA_character_)
            tryCatch(rcrossref::cr_cn(doi, "bibtex"), error=function(e) NA_character_)
          }
          bibs <- unique(na.omit(vapply(pubs$doi, get_bib, "")))

          if (length(bibs) == 0) {
            message("Nessun BibTeX recuperato."); quit(save="no", status=0)
          }

          dir.create("data", showWarnings = FALSE)
          writeLines(bibs, "data/publications.bib")
          message("Scritto data/publications.bib con ", length(bibs), " voci.")
          RSCRIPT

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Academic CLI
        run: pip install -U academic

      - name: Import into content/publication
        if: ${{ hashFiles('data/publications.bib') != '' }}
        run: academic import --bibtex data/publications.bib --overwrite

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/publication data/publications.bib || true
          git commit -m "Auto-update publications from Google Scholar" || echo "No changes"
          git push || true
