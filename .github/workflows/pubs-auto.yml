name: Auto update publications (ORCID)

on:
  schedule:
    - cron: "0 3 * * 1"   # lunedì 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-pubs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            httr
            jsonlite
            rcrossref
            bibtex
            yaml

      # 1) Rigenera SEMPRE il BibTeX da ORCID e sovrascrive il file se ha contenuti
      - name: Fetch BibTeX from ORCID (always overwrite if non-empty)
        env:
          ORCID_ID: "0000-0003-2920-9572"  # <-- il tuo ORCID
        run: |
          mkdir -p .github/workflow_data
          Rscript - <<'RSCRIPT'
          library(httr); library(jsonlite); library(rcrossref)

          orcid <- Sys.getenv("ORCID_ID")
          stopifnot(nzchar(orcid))

          url <- sprintf("https://pub.orcid.org/v3.0/%s/works", orcid)
          resp <- httr::GET(url, httr::accept_json()); httr::stop_for_status(resp)
          works <- jsonlite::fromJSON(httr::content(resp, "text", encoding = "UTF-8"), simplifyVector = FALSE)

          `%||%` <- function(x, y) if (is.null(x)) y else x
          extract_dois <- function(group){
            ws <- group[["work-summary"]]; if (is.null(ws)) return(character(0))
            unlist(lapply(ws, function(w){
              ext <- w[["external-ids"]][["external-id"]]; if (is.null(ext)) return(character(0))
              dois <- vapply(ext, function(e){
                typ <- tolower(e[["external-id-type"]] %||% ""); val <- e[["external-id-value"]] %||% ""
                if (typ == "doi" && nzchar(val)) gsub("^https?://(dx\\.)?doi\\.org/", "", val, ignore.case=TRUE) else ""
              }, "")
              dois[nzchar(dois)]
            }), use.names=FALSE)
          }
          groups <- works[["group"]] %||% list()
          dois <- unique(unlist(lapply(groups, extract_dois), use.names = FALSE))

          if (!length(dois)) {
            message("ORCID ha restituito 0 DOI: mantengo il file esistente (se presente).")
            quit(save="no", status=0)
          }

          get_bib <- function(doi) tryCatch({ Sys.sleep(0.15); rcrossref::cr_cn(doi,"bibtex") }, error=function(e) NA_character_)
          bibs <- unique(na.omit(vapply(dois, get_bib, "")))

          if (!length(bibs)) {
            message("Crossref ha restituito 0 BibTeX: mantengo il file esistente (se presente).")
            quit(save="no", status=0)
          }

          writeLines(bibs, ".github/workflow_data/publications.bib")
          cat("Scritto .github/workflow_data/publications.bib con", length(bibs), "voci\n")
          RSCRIPT

      # 2) Normalizza BibTeX (la CLI è pignola sul formato)
      - name: Normalize BibTeX (CLI-friendly)
        if: ${{ hashFiles('.github/workflow_data/publications.bib') != '' }}
        run: |
          Rscript - <<'RSCRIPT'
          library(bibtex)
          x <- bibtex::read.bib(".github/workflow_data/publications.bib")
          bibtex::write.bib(x, file = ".github/workflow_data/publications_clean.bib")
          cat("Normalizzato in .github/workflow_data/publications_clean.bib\n")
          RSCRIPT

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Academic CLI
        run: pip install -U academic

      # 3) Import in content/publication
      - name: Import into content/publication
        if: ${{ hashFiles('.github/workflow_data/publications_clean.bib') != '' }}
        run: |
          mkdir -p content/publication
          abs_in="$(pwd)/.github/workflow_data/publications_clean.bib"
          abs_out="$(pwd)/content/publication"
          academic import --bibtex "$abs_in" "$abs_out" --overwrite --normalize -v

      # 4) NORMALIZZA publication_types alla forma compatta: publication_types: ["<code>"]
      - name: Normalize publication_types to compact numeric form
        run: |
          Rscript - <<'RSCRIPT'
          # Mappa dai tipi CSL (stringhe) ai codici Wowchemy
          type_map <- c(
            "journal-article"="2","article-journal"="2",
            "proceedings-article"="1","conference-paper"="1",
            "preprint"="3","posted-content"="3",
            "report"="4",
            "book"="5",
            "book-chapter"="6","chapter"="6",
            "thesis"="7",
            "patent"="8"
          )

          normalize_block <- function(fm_lines) {
            # Trova inizio campo publication_types:
            s <- grep("^\\s*publication_types\\s*:\\s*", fm_lines)
            if (length(s)) {
              s <- s[1]
              # Raccogli eventuali righe lista "- ..." successive
              e <- s
              i <- s + 1
              while (i <= length(fm_lines) &&
                     (grepl("^\\s*-\\s*", fm_lines[i]) || grepl("^\\s*\\[", fm_lines[i]) || grepl("^\\s*\"?\\d+\"?\\s*\\]?$", fm_lines[i]))) {
                e <- i
                i <- i + 1
              }
              # Estrai valori attuali
              block <- fm_lines[s:e]
              values <- character(0)

              # Casi: lista con "-" oppure inline con [ ... ]
              dash_vals <- sub("^\\s*-\\s*", "", block[-1])
              dash_vals <- dash_vals[nzchar(dash_vals)]
              if (length(dash_vals)) {
                values <- dash_vals
              } else {
                inline <- paste(block, collapse=" ")
                m <- regmatches(inline, gregexpr("\\[([^\\]]+)\\]", inline))[[1]]
                if (length(m)) {
                  inside <- sub("^\\[|\\]$", "", m[1])
                  values <- trimws(strsplit(inside, ",")[[1]])
                  values <- gsub('^["\\'\\']|["\\'\\']$', "", values)
                } else {
                  # valore singolo sulla stessa riga?
                  single <- sub("^\\s*publication_types\\s*:\\s*", "", block[1])
                  single <- trimws(single)
                  single <- gsub('^["\\'\\']|["\\'\\']$', "", single)
                  if (nzchar(single)) values <- single
                }
              }

              # Mappa a codice
              to_code <- function(x) {
                xl <- tolower(trimws(x))
                if (grepl("^[0-9]+$", xl)) return(xl)
                if (!is.na(type_map[xl])) return(unname(type_map[xl]))
                "0"
              }
              codes <- vapply(values, to_code, character(1))
              if (length(codes) == 0) codes <- "0"
              if (any(codes != "0")) codes <- codes[codes != "0"][1] else codes <- "0"

              # Sostituisci il blocco con forma compatta
              fm_lines <- append(fm_lines[0:(s-1)],
                                 values = paste0("publication_types: [\"", codes, "\"]"))
              if (e < length(fm_lines)) {
                fm_lines <- c(fm_lines, fm_lines[(e+1):length(fm_lines)])
              }
              return(fm_lines)
            } else {
              # Campo mancante: inserisci dopo la prima riga del front matter
              fm_lines <- append(fm_lines, values = 'publication_types: ["0"]', after = 1L)
              return(fm_lines)
            }
          }

          files <- list.files("content/publication", pattern="^index\\.md$", recursive=TRUE, full.names=TRUE)
          fixed <- 0L
          for (f in files) {
            lines <- readLines(f, warn=FALSE, encoding="UTF-8")
            if (length(lines) < 3 || !startsWith(lines[1], "---")) next
            end <- which(lines[-1] == "---")
            if (!length(end)) next
            end <- end[1] + 1L

            fm <- lines[2:(end-1)]
            body <- if (end+1 <= length(lines)) lines[(end+1):length(lines)] else character(0)

            new_fm <- tryCatch(normalize_block(fm), error=function(e) fm)
            writeLines(c("---", new_fm, "---", body), f, useBytes=TRUE)
            fixed <- fixed + 1L
          }
          cat("publication_types normalizzati in", fixed, "pagine.\n")
          RSCRIPT

      # 5) Svuota il corpo (niente placeholder)
      - name: Clear placeholder body in index.md
        run: |
          Rscript - <<'RSCRIPT'
          files <- list.files("content/publication", pattern="^index\\.md$", recursive=TRUE, full.names=TRUE)
          cleared <- 0L
          for (f in files) {
            x <- readLines(f, warn = FALSE, encoding = "UTF-8")
            if (!length(x)) next
            k <- 0L
            if (startsWith(x[1], "---")) {
              idx <- which(x[-1] == "---")
              if (length(idx)) k <- idx[1] + 1L
            }
            if (k == 0L) next
            header <- x[1:k]
            # Corpo vuoto (2 righe per separazione pulita)
            writeLines(c(header, "", ""), f, useBytes = TRUE)
            cleared <- cleared + 1L
          }
          cat("Corpi svuotati in", cleared, "pubblicazioni.\n")
          RSCRIPT

      # 6) Commit & push
      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/publication .github/workflow_data/publications*.bib || true
          git commit -m "Auto-update publications from ORCID (normalized types + cleaned bodies)" || echo "No changes"
          git push || true
