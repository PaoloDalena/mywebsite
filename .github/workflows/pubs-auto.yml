name: Auto update publications (ORCID)

on:
  schedule:
    - cron: "0 3 * * 1"   # lunedì 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-pubs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            httr
            jsonlite
            rcrossref

      - name: Generate BibTeX from ORCID
        env:
          ORCID_ID: "0000-0003-2920-9572"   # <-- il tuo ORCID
        run: |
          Rscript - <<'RSCRIPT'
          library(httr)
          library(jsonlite)
          library(rcrossref)

          orcid <- Sys.getenv("ORCID_ID")
          if (!nzchar(orcid)) stop("ORCID_ID non impostato")

          # 1) Leggi le "works" da ORCID (API pubblica, JSON)
          url <- sprintf("https://pub.orcid.org/v3.0/%s/works", orcid)
          resp <- httr::GET(url, httr::accept_json())
          stop_for_status(resp)
          works <- jsonlite::fromJSON(httr::content(resp, "text", encoding = "UTF-8"), simplifyVector = FALSE)

          # 2) Estrai i DOI dalle works (nei "external-ids")
          extract_dois <- function(work_group) {
            # Struttura: group -> work-summary (lista) -> external-ids -> external-id (lista)
            ws <- work_group[["work-summary"]]
            if (is.null(ws)) return(character(0))
            unlist(lapply(ws, function(w) {
              ext <- w[["external-ids"]][["external-id"]]
              if (is.null(ext)) return(character(0))
              dois <- vapply(ext, function(e) {
                typ <- tolower(e[["external-id-type"]] %||% "")
                val <- e[["external-id-value"]] %||% ""
                if (typ == "doi" && nzchar(val)) {
                  # normalizza: togli eventuale "https://doi.org/"
                  gsub("^https?://(dx\\.)?doi\\.org/", "", val, ignore.case = TRUE)
                } else ""
              }, "")
              dois[nzchar(dois)]
            }), use.names = FALSE)
          }
          `%||%` <- function(x, y) if (is.null(x)) y else x

          groups <- works[["group"]] %||% list()
          dois <- unique(unlist(lapply(groups, extract_dois), use.names = FALSE))

          if (length(dois) == 0) {
            message("Nessun DOI trovato su ORCID.")
            quit(save="no", status=0)
          }

          message("Trovati ", length(dois), " DOI su ORCID. Scarico i BibTeX da Crossref…")

          # 3) Per ciascun DOI, scarica il BibTeX diretto da Crossref
          get_bib <- function(doi) {
            tryCatch({
              # piccolo backoff per cortesia verso l'API
              Sys.sleep(0.15)
              rcrossref::cr_cn(doi, "bibtex")
            }, error = function(e) NA_character_)
          }
          bibs <- unique(na.omit(vapply(dois, get_bib, "")))

          if (length(bibs) == 0) {
            message("Nessun BibTeX recuperato (possibile downtime Crossref o DOI non risolti).")
            quit(save="no", status=0)
          }

          dir.create("data", showWarnings = FALSE)
          writeLines(bibs, "data/publications.bib")
          message("Scritto data/publications.bib con ", length(bibs), " voci.")
          RSCRIPT

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Academic CLI
        run: pip install -U academic

      - name: Import into content/publication
        if: ${{ hashFiles('data/publications.bib') != '' }}
        run: academic import --bibtex data/publications.bib --overwrite

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/publication data/publications.bib || true
          git commit -m "Auto-update publications from ORCID" || echo "No changes"
          git push || true
